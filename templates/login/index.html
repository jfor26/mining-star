{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mining Star ERP · Iniciar sesión</title>

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="login-container">

    <!-- PANEL IZQUIERDO -->
    <div class="banner">
        <img src="{% static 'img/banner.png' %}"
             class="banner-img"
             alt="Mining Star ERP">
    </div>

    <!-- PANEL DERECHO -->
    <div class="login-box">

        <h2>Mining Star ERP</h2>
        <p>Sistema Integral de Gestión Minera</p>

        {% if messages %}
            <div class="mensajes">
                {% for message in messages %}
                    <p class="mensaje mensaje-{{ message.tags }}">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        {{ message }}
                    </p>
                {% endfor %}
            </div>
        {% endif %}

        <!--
            Este es un formulario HTML real que envía por POST al servidor.
            Antes los datos no salían del navegador: un script comparaba
            el usuario contra "admin"/"1234" escrito en el propio JavaScript
            y redirigía a /dashboard/. Cualquiera podía leer esa contraseña
            con "Ver código fuente".
        -->
        <form method="post" action="{% url 'login' %}" autocomplete="on">

            {% csrf_token %}

            <div class="input-group">
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Usuario"
                    autocomplete="username"
                    required
                    autofocus>
            </div>

            <div class="password-container">
                <input
                    type="password"
                    id="clave"
                    name="contrasena"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                    required>

                <i class="fa-solid fa-eye"
                   onclick="mostrarClave()"
                   role="button"
                   aria-label="Mostrar u ocultar la contraseña"></i>
            </div>

            <button type="submit">
                <i class="fa-solid fa-right-to-bracket"></i>
                Ingresar
            </button>

        </form>

        <p class="version">Mining Star ERP v1.0</p>

    </div>

</div>

<script src="{% static 'js/script.js' %}"></script>

</body>
</html>
