{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <title>Editar Proveedor</title>

    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'css/proveedores.css' %}">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <h2>
            <i class="fa-solid fa-mountain"></i>
            Mining Star
        </h2>

        <a href="/dashboard/">
            <i class="fa-solid fa-house"></i>
            Dashboard
        </a>

        <a href="/empleados/">
            <i class="fa-solid fa-user-tie"></i>
            Empleados
        </a>

        <a href="/clientes/">
            <i class="fa-solid fa-users"></i>
            Clientes
        </a>

        <a href="/productos/">
            <i class="fa-solid fa-box-open"></i>
            Productos
        </a>

        <a href="/proveedores/" class="active">
            <i class="fa-solid fa-truck-fast"></i>
            Proveedores
        </a>

        <a href="/ventas/">
            <i class="fa-solid fa-cart-shopping"></i>
            Ventas
        </a>

        <a href="/reportes/">
            <i class="fa-solid fa-chart-line"></i>
            Reportes
        </a>

        <a href="/logout/" class="logout">
            <i class="fa-solid fa-right-from-bracket"></i>
            Cerrar Sesión
        </a>

    </div>

    <!-- CONTENIDO -->
    <div class="contenido">

        <h1>Editar Proveedor</h1>

        <div class="form-card">

            <form method="POST">

                {% csrf_token %}

                <div class="form-grid">

                    <input
                        type="text"
                        name="nit"
                        value="{{ proveedor.nit }}"
                        required>

                    <input
                        type="text"
                        name="empresa"
                        value="{{ proveedor.empresa }}"
                        required>

                    <input
                        type="text"
                        name="contacto"
                        value="{{ proveedor.contacto }}"
                        required>

                    <input
                        type="email"
                        name="correo"
                        value="{{ proveedor.correo }}"
                        required>

                    <input
                        type="text"
                        name="telefono"
                        value="{{ proveedor.telefono }}"
                        required>

                    <input
                        type="text"
                        name="ciudad"
                        value="{{ proveedor.ciudad }}"
                        required>

                    <input
                        type="text"
                        name="direccion"
                        value="{{ proveedor.direccion }}"
                        required>

                </div>

                <div class="acciones-form">

                    <button class="btn-guardar" type="submit">

                        <i class="fa-solid fa-floppy-disk"></i>

                        Guardar Cambios

                    </button>

                    <a href="/proveedores/" class="btn-cancelar">

                        <i class="fa-solid fa-arrow-left"></i>

                        Cancelar

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
